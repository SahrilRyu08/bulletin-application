<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${post.title}">Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>

<body class="container mt-4">

<h3 th:text="${post.title}"></h3>

<p>
    Author: <span th:text="${post.author}"></span> |
    Views: <span th:text="${post.viewCount}"></span> |
    Created At:
    <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></span>

    <span th:if="${post.updatedAt != null}">
      | Updated At:
      <span th:text="${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}"></span>
    </span>
</p>

<hr/>

<p th:text="${post.content}" style="white-space: pre-wrap"></p>

<hr/>

<div th:if="${error}"
     class="alert alert-danger"
     th:text="${error}">
</div>

<!-- Delete Form -->
<form th:action="@{/posts/{id}/delete(id=${post.id})}"
      method="post"
      class="d-inline">

    <input type="password"
           name="inputPassword"
           class="form-control d-inline w-auto"
           placeholder="Password"/>

    <button class="btn btn-danger">
        Delete
    </button>
</form>

<a th:href="@{/posts/{id}/edit(id=${post.id})}"
   class="btn btn-warning ms-2">
    Edit
</a>

<a href="/posts"
   class="btn btn-secondary ms-2">
    Back to List
</a>

</body>
</html>
