<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create / Edit Post</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>

<body class="container mt-4">

<h3 th:text="${post.id == null} ? 'Create Post' : 'Edit Post'"></h3>

<div th:if="${error}"
     class="alert alert-danger"
     th:text="${error}">
</div>

<form th:if="${post.id == null}"
      th:action="@{/posts}"
      method="post">

    <div class="mb-3">
        <label>Title</label>
        <input class="form-control"
               name="title"
               maxlength="100"
               th:value="${post.title}"
               required/>
    </div>

    <div class="mb-3">
        <label>Author</label>
        <input class="form-control"
               name="author"
               maxlength="30"
               th:value="${post.author}"
               required/>
    </div>

    <div class="mb-3">
        <label>Password</label>
        <input type="password"
               class="form-control"
               name="password"
               required/>
    </div>

    <div class="mb-3">
        <label>Content</label>
        <textarea class="form-control"
                  name="content"
                  rows="8"
                  required
                  th:text="${post.content}">
      </textarea>
    </div>

    <button class="btn btn-primary">
        Submit
    </button>

    <a href="/posts"
       class="btn btn-secondary ms-2">
        Cancel
    </a>
</form>

<form th:if="${post.id != null}"
      th:action="@{/posts/{id}/edit(id=${post.id})}"
      method="post">

    <div class="mb-3">
        <label>Title</label>
        <input class="form-control"
               name="title"
               maxlength="100"
               th:value="${post.title}"
               required/>
    </div>

    <div class="mb-3">
        <label>Author (Read Only)</label>
        <input class="form-control"
               name="author"
               th:value="${post.author}"
               readonly/>
    </div>

    <div class="mb-3">
        <label>Password Confirmation</label>
        <input type="password"
               class="form-control"
               name="inputPassword"
               required/>
    </div>

    <div class="mb-3">
        <label>Content</label>
        <textarea class="form-control"
                  name="content"
                  rows="8"
                  required
                  th:text="${post.content}">
      </textarea>
    </div>

    <button class="btn btn-warning">
        Update
    </button>

    <a th:href="@{/posts/{id}(id=${post.id})}"
       class="btn btn-secondary ms-2">
        Cancel
    </a>

</form>

</body>
</html>
